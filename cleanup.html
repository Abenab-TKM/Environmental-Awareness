<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join a Cleanup</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        }

        .header {
            border-left: 5px solid #0f766e;
            padding-left: 15px;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #ffffff;
            margin-bottom: 8px;
        }

        .header p {
            color: #94a3b8;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #38bdf8;
            font-weight: 600;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border-radius: 9px;
            border: 2px solid #334155;
            background-color: #0f172a;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #22d3ee;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background-color: #0f766e;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #14b8a6;
            transform: translateY(-3px);
            box-shadow: 0 7px 18px rgba(34, 211, 238, 0.25);
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Join a Cleanup</h1>
        <p>
            Register to participate in a community cleanup and help keep
            our environment clean, healthy and beautiful.
        </p>
    </div>

    <form>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" placeholder="Enter your phone number" required>
        </div>

        <div class="form-group">
            <label>Age</label>
            <input type="number" min="10" placeholder="Enter your age">
        </div>

        <div class="form-group">
            <label>Location</label>
            <input type="text" placeholder="Your city or neighborhood" required>
        </div>

        <div class="form-group">
            <label>Preferred Cleanup Date</label>
            <input type="date" required>
        </div>

        <div class="form-group">
            <label>Cleanup Area</label>
            <select required>
                <option value="">Choose an area</option>
                <option>School Area</option>
                <option>Neighborhood</option>
                <option>Park</option>
                <option>Roadside</option>
                <option>River or Lake Area</option>
                <option>Other</option>
            </select>
        </div>

        <div class="form-group">
            <label>Additional Message</label>
            <textarea placeholder="Tell us anything we should know..."></textarea>
        </div>

        <button type="submit">Join Cleanup</button>

    </form>

</div>

</body>
</html>
